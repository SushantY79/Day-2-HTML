<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }
    .card {
      width: min(90%, 600px);
      padding: 3rem 2rem;
      text-align: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, .14);
      box-shadow: 0 15px 40px rgba(0, 0, 0, .2);
    }
    h1 { margin-top: 0; font-size: 2.5rem; }
    p { line-height: 1.6; color: #e0e7ff; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: .8rem 1.5rem;
      color: #2563eb;
      background: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #dbeafe; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to My Website</h1>
    <p>This page is connected to <strong>1e.html</strong>.</p>
    <a href="1e.html">Open 1e.html</a>
  </main>
</body>
</html>
